configuration:
  oauth_token:
    name: OAuth token
    description: Long-lived token from "claude setup-token", logs the CLI in with your Claude subscription.
  authorized_keys:
    name: Authorized keys
    description: One line per plugin, as printed in the server log, e.g. "ed25519 MCowBQYDK2VwAyEA... claudechat@server".
  model:
    name: Model
    description: Used when a request names none (sonnet, opus, haiku or a full ID).
  web:
    name: Web research
    description: Allow web research when a client asks for it.
  web_domains:
    name: Web domains
    description: Comma separated sites Claude may read pages from. Empty = Minecraft sites, * = all.
  parallel:
    name: Parallel calls
    description: Max CLI processes at once.
  queue_timeout:
    name: Queue timeout (seconds)
    description: How long a request waits for a free slot before 503.
  timeout:
    name: Timeout (seconds)
    description: How long a single CLI call may take.
  tailscale:
    name: Tailscale
    description: Run Tailscale inside the add-on as a device of its own in your tailnet.
  tailscale_hostname:
    name: Tailscale hostname
    description: Name in the tailnet, gives the address https://<name>.<tailnet>.ts.net.
  tailscale_authkey:
    name: Tailscale auth key
    description: Optional. Without one, the first start prints a login link to the log.
  tailscale_funnel:
    name: Tailscale Funnel
    description: Make the bridge reachable from the internet with Tailscale Funnel. Off = tailnet only.
network:
  8787/tcp: Bridge API (signed requests only)
